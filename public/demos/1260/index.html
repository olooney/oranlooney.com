<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1260 - 4D Divisor Lattice</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
      font-family: system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      width: 892px;
      height: 892px;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      background: white;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      background: white;
      outline: none;
      border: none;
      box-shadow: none;
    }

    canvas.dragging {
      cursor: grabbing;
    }
  </style>
  <script src="index.js" defer></script>
</head>
<body>
  <div class="stage">
    <canvas id="lattice" tabindex="0" aria-label="Interactive 4D projection of the divisors of 1260"></canvas>
  </div>
</body>
</html>
